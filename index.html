<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEX.TROY Login - Captcha</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Background Particle System -->
    <canvas id="bg-canvas"></canvas>

    <div class="login-container">
        <div class="login-header">
            <h1 id="auth-title">DEX.TROY</h1>
            <p id="auth-subtitle">Secure Access System</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login">Login</button>
            <button class="auth-tab" id="tab-register">Register</button>
        </div>

        <!-- Contenedor de los Inputs (Se esconde cuando salta el Captcha) -->
        <form id="auth-form">
            <div id="form-inputs">
                <div class="input-group" id="group-username">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="El_pepe44">
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="miscocos@gmail.rar" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="input-group" id="group-confirm">
                    <label for="password-confirm">Confirm Password</label>
                    <input type="password" id="password-confirm" placeholder="••••••••">
                </div>
            </div>

            <!-- Pantalla de Carga Trucha (Intermedia) -->
            <div id="fake-loading">
                <div class="cmd-loader">
                    <div class="cmd-header">
                        <span class="cmd-title">C:\Windows\System32\cmd.exe</span>
                        <span class="cmd-close">✕</span>
                    </div>
                    <div class="cmd-text">
                        <p class="t-line">C:\DEX.TROY> Establishing secure connection...</p>
                        <p class="t-line">C:\DEX.TROY> Encrypting payload...</p>
                        <p class="t-line">C:\DEX.TROY> Validating credentials...</p>
                        <p class="t-line blinking">_</p>
                    </div>
                </div>
            </div>

            <!-- Pantalla intermedia de "Verify" (sale antes del juego) -->
            <div id="captcha-pre-verify">
                <p class="verify-msg">To continue, please verify you are human.</p>
                <button type="button" id="start-captcha-btn" class="btn-outline">VERIFY</button>
            </div>

            <!-- El Captcha Infernal (Juego) -->
            <div class="captcha-container" id="captcha-container">
                <button id="mute-btn" class="audio-toggle" type="button" aria-label="Toggle Audio">
                    <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                    <svg id="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="1" x2="1" y2="23"></line>
                    </svg>
                </button>
                <canvas id="game-canvas" width="400" height="500"></canvas>
                <div class="grid-overlay"></div>
                <div id="captcha-success">
                    <div class="checkmark">✓</div>
                    <p>Verification Complete</p>
                </div>
                <div id="captcha-fail">
                    <p class="fail-msg">Verification Failed</p>
                    <button type="button" id="retry-captcha-btn" class="btn-outline">Retry</button>
                    <button type="button" id="cancel-captcha-btn" class="btn-outline">Back to Form</button>
                </div>
            </div>

            <button type="submit" id="login-btn">LOGIN</button>
        </form>
    </div>

    <!-- Logo -->
    <a href="https://github.com/RoyBruna" target="_blank" rel="noopener noreferrer" class="watermark-logo">
        <img src="assets/images/logo.jpg" alt="RoyBruna Github">
    </a>

    <script type="module" src="js/main.js"></script>
</body>

</html>
